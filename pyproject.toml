[project]
name = "periodic-stego"
version = "0.1.0"
description = "Detect periodic image signals with FFT and autocorrelation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
periodic-stego = "periodic_stego.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["periodic_stego*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
